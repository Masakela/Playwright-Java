# >>> MOVE THIS FILE TO:  .github/workflows/ci.yml  <<<
# GitHub protects the .github/workflows/ path, so remote tools cannot write there.
# In this project folder run (PowerShell):
#   New-Item -ItemType Directory -Force .github\workflows
#   Move-Item github-actions-ci.yml .github\workflows\ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Set up Node (for the reference agent)
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Playwright browsers (Java)
        run: >
          mvn -q compile exec:java -e
          -D exec.mainClass=com.microsoft.playwright.CLI
          -D exec.args="install --with-deps chromium"
      - name: Start reference agent
        run: |
          node agent-server/server.js & echo $! > agent.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break || sleep 0.5; done
      - name: Run tests (UI + offline + live)
        run: >
          mvn -q test
          -Dsurefire.suiteXmlFiles=testng-ci.xml
          -Dagent.base.url=http://localhost:8080
          -Dallure.results.directory=${{ github.workspace }}/target/allure-results
      - name: Stop reference agent
        if: always()
        run: kill "$(cat agent.pid)" 2>/dev/null || true
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: java-surefire, path: target/surefire-reports }
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: java-allure, path: target/allure-results, if-no-files-found: ignore }

  report:
    needs: [java-tests]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Restore KPI history
        uses: actions/cache@v4
        with:
          path: kpi-history
          key: kpi-history-${{ github.run_id }}
          restore-keys: kpi-history-
      - name: Assemble
        run: |
          mkdir -p site kpi-history
          cp -r artifacts/java-allure allure-results 2>/dev/null || mkdir -p allure-results
      - name: Build KPI dashboard
        run: >
          node scripts/kpi-report.js
          --junit artifacts/java-surefire
          --out site
          --history kpi-history/history.json
          --branch "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Generate Allure report
        continue-on-error: true
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o site/allure
      - name: KPI summary -> job summary
        run: cat site/kpi-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with: { name: qa-report-site, path: site }
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
